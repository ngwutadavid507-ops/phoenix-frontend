<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phoenix Production Core</title>
    <style>
        :root {
            --bg-dark: #0b0e14; 
            --bg-surface: #161b22; 
            --border: #30363d;
            --primary: #10b981; 
            --text-main: #ffffff; 
            --text-muted: #8b949e; 
            --danger: #f85149;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { margin: 0; background-color: var(--bg-dark); color: var(--text-main); overflow: hidden; }
        .app-shell { display: flex; flex-direction: column; width: 100vw; height: 100vh; }
        
        .app-header { background: var(--bg-surface); padding: 14px 16px 0 16px; border-bottom: 1px solid var(--border); }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .brand { font-size: 18px; font-weight: 800; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; }
        .tabs-row { display: flex; margin-top: 12px; overflow-x: auto; scrollbar-width: none; }
        .tabs-row::-webkit-scrollbar { display: none; }
        .tab-item {
            flex: 1; text-align: center; padding: 12px 8px; font-size: 12px; font-weight: 700;
            color: var(--text-muted); border: none; background: none; cursor: pointer; position: relative; white-space: nowrap;
        }
        .tab-item.active { color: var(--primary); }
        .tab-item.active::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: var(--primary); }
        
        .nested-tab-bar { display: flex; background: rgba(0,0,0,0.3); border-radius: 8px; padding: 4px; margin-bottom: 12px; gap: 4px; }
        .sub-tab-item { flex: 1; text-align: center; padding: 8px 0; font-size: 11px; font-weight: 700; color: var(--text-muted); border: none; background: none; cursor: pointer; border-radius: 6px; }
        .sub-tab-item.active { background: var(--primary); color: #fff; }

        .view-viewport { flex: 1; overflow: hidden; position: relative; }
        .view-pane { display: none; width: 100%; height: 100%; overflow-y: auto; padding: 16px; flex-direction: column; }
        .view-pane.active { display: flex; }
        .sub-pane { display: none; }
        .sub-pane.active { display: block; }
        
        .phoenix-card { background: var(--bg-surface); border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid var(--border); }
        .flex-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .signal-badge { background: rgba(16,185,129,0.15); color: var(--primary); padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .signal-badge.short { background: rgba(248,81,73,0.15); color: var(--danger); }
        
        .chat-output { flex: 1; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow-y: auto; font-size: 13px; min-height: 240px; max-height: 360px; margin-bottom: 12px; }
        .chat-entry-box { display: flex; gap: 8px; }
        .chat-input { flex: 1; background: var(--bg-dark); border: 1px solid var(--border); color: #fff; border-radius: 6px; padding: 10px; font-size: 13px; }
        .chat-btn { background: var(--primary); color: #fff; border: none; border-radius: 6px; padding: 0 16px; font-weight: bold; cursor: pointer; }
        
        .pair-strip { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--border); }
        .state-info { padding: 32px 16px; text-align: center; color: var(--text-muted); font-size: 13px; font-weight: 500; }
        .state-error { padding: 32px 16px; text-align: center; color: var(--danger); font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="app-shell">
        <header class="app-header">
            <div class="header-top">
                <div class="brand">Phoenix System</div>
                <div id="runtime-status" style="font-size:11px; color:var(--primary); font-weight:bold; text-transform:uppercase;">● Real-Time Feed Linked</div>
            </div>
            <div class="tabs-row">
                <button class="tab-item active" onclick="switchTab('polymarket')">Polymarket</button>
                <button class="tab-item" onclick="switchTab('news-ai')">News / AI</button>
                <button class="tab-item" onclick="switchTab('signals')">Signals Engine</button>
                <button class="tab-item" onclick="switchTab('pnl')">Performance Matrix</button>
                <button class="tab-item" onclick="switchTab('pairs')">Live Pairs</button>
            </div>
        </header>

        <main class="view-viewport">
            <div id="pane-polymarket" class="view-pane active"><div id="poly-root"></div></div>

            <div id="pane-news-ai" class="view-pane">
                <div class="nested-tab-bar">
                    <button class="sub-tab-item active" id="btn-sub-news" onclick="switchSubTab('news')">Live News Feed</button>
                    <button class="sub-tab-item" id="btn-sub-ai" onclick="switchSubTab('ai')">Gemini AI Engine</button>
                </div>
                <div id="sub-pane-news" class="sub-pane active"><div id="news-root"></div></div>
                <div id="sub-pane-ai" class="sub-pane">
                    <div class="chat-output" id="chat-session-box">Phoenix Active Processing Core online. Send structural queries directly to the model...</div>
                    <div class="chat-entry-box">
                        <input type="text" id="chat-input-field" class="chat-input" placeholder="Query current asset technical vectors...">
                        <button class="chat-btn" onclick="executeAiQuery()">Send</button>
                    </div>
                </div>
            </div>

            <div id="pane-signals" class="view-pane"><div id="signals-root"></div></div>

            <div id="pane-pnl" class="view-pane">
                <div class="phoenix-card" style="text-align: center; padding: 32px 16px;">
                    <div style="font-size:11px; color:var(--text-muted); font-weight:bold; text-transform:uppercase; letter-spacing:0.5px;">Calculated 24h Signal Variance</div>
                    <div id="pnl-val" style="color: var(--primary); margin: 12px 0; font-size:44px; font-weight:900; font-family:monospace;">Connecting...</div>
                </div>
            </div>

            <div id="pane-pairs" class="view-pane" style="padding:0;"><div id="pairs-root"></div></div>
        </main>
    </div>

    <script>
        const CORE_API = "https://phoenix-signal-backend.onrender.com";

        function switchTab(id) {
            document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.view-pane').forEach(el => el.classList.remove('active'));
            
            const tabBtn = Array.from(document.querySelectorAll('.tab-item')).find(b => b.getAttribute('onclick').includes(`'${id}'`));
            if(tabBtn) tabBtn.classList.add('active');
            
            const targetPane = document.getElementById(`pane-${id}`);
            if(targetPane) targetPane.classList.add('active');

            if(id === 'polymarket') fetchPolymarket();
            if(id === 'news-ai') switchSubTab('news');
            if(id === 'signals') fetchSignals();
            if(id === 'pnl') fetchPnl();
            if(id === 'pairs') fetchPairs();
        }

        function switchSubTab(subId) {
            document.querySelectorAll('.sub-tab-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.sub-pane').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`btn-sub-${subId}`).classList.add('active');
            document.getElementById(`sub-pane-${subId}`).classList.add('active');
            if(subId === 'news') fetchNews();
        }

        async function fetchSignals() {
            const container = document.getElementById('signals-root');
            container.innerHTML = '<div class="state-info">Scanning algorithmic market positions...</div>';
            try {
                const response = await fetch(`${CORE_API}/api/v2/history`);
                const data = await response.json();
                
                if (!data.signals || data.signals.length === 0) {
                    container.innerHTML = '<div class="state-info">No linear trend vectors met execution rules at this timestamp.</div>';
                    return;
                }
                
                container.innerHTML = data.signals.map(s => `
                    <div class="phoenix-card">
                        <div class="flex-row" style="margin-bottom:14px;">
                            <span style="font-size:20px; font-weight:900; letter-spacing:-0.5px;">${s.pair}</span>
                            <span class="signal-badge ${s.direction.includes('SHORT') ? 'short' : ''}">${s.direction}</span>
                        </div>
                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px; font-size:13px; font-family:monospace;">
                            <div>ENTRY: <b style="color:#fff">$${s.entry}</b></div>
                            <div>CONFIDENCE: <b style="color:var(--primary)">${s.confidence}</b></div>
                            <div>STOP LOSS: <b style="color:var(--danger)">$${s.sl}</b></div>
                            <div>TAKE PROFIT: <b style="color:var(--primary)">$${s.tp}</b></div>
                        </div>
                    </div>`).join('');
            } catch(e) { 
                container.innerHTML = '<div class="state-error">Connection link broken. Verify backend instance logs.</div>'; 
            }
        }

        async function fetchPairs() {
            const container = document.getElementById('pairs-root');
            container.innerHTML = '<div class="state-info" style="padding:20px;">Fetching spot index books...</div>';
            try {
                const response = await fetch(`${CORE_API}/api/v2/pairs`);
                const coins = await response.json();
                
                if(!coins || coins.length === 0) { 
                    container.innerHTML = '<div class="state-info" style="padding:20px;">Spot index data stream returned no results.</div>'; 
                    return; 
                }
                
                container.innerHTML = coins.map(c => {
                    const changeString = String(c.change || "0.00%");
                    const isNegative = changeString.startsWith('-');
                    return `
                    <div class="pair-strip">
                        <div>
                            <span style="font-weight:bold; font-size:15px;">${c.symbol} / USDT</span>
                            <div style="font-size:11px; color:var(--text-muted);">${c.name}</div>
                        </div>
                        <div style="text-align:right;">
                            <span style="font-family:monospace; font-weight:bold; font-size:15px;">$${c.price}</span>
                            <div style="font-size:12px; font-weight:bold; color:${isNegative ? 'var(--danger)' : 'var(--primary)'}">${changeString}</div>
                        </div>
                    </div>`;
                }).join('');
            } catch(e) { 
                container.innerHTML = '<div class="state-error" style="padding:20px;">Pipeline error connecting to spot asset array.</div>'; 
            }
        }

        async function fetchPolymarket() {
            const container = document.getElementById('poly-root');
            container.innerHTML = '<div class="state-info">Polling real-time binary option vectors...</div>';
            try {
                const response = await fetch(`${CORE_API}/api/v2/polymarket`);
                const data = await response.json();
                
                if(!data.markets || data.markets.length === 0) { 
                    container.innerHTML = '<div class="state-info">No active prediction markets cleared volume filters.</div>'; 
                    return; 
                }
                
                container.innerHTML = data.markets.map(m => `
                    <div class="phoenix-card">
                        <div class="flex-row">
                            <span style="font-weight:bold; font-size:13.5px; max-width:82%; line-height:1.4;">${m.title}</span>
                            <span class="signal-badge">${m.odds}</span>
                        </div>
                    </div>`).join('');
            } catch(e) {
                container.innerHTML = '<div class="state-error">Failed to synchronize clob contract data metrics.</div>';
            }
        }

        async function fetchNews() {
            const container = document.getElementById('news-root');
            container.innerHTML = '<div class="state-info">Siphoning global sentiment news wires...</div>';
            try {
                const response = await fetch(`${CORE_API}/api/v2/news`);
                const data = await response.json();
                
                if(!data.news || data.news.length === 0) { 
                    container.innerHTML = '<div class="state-info">No news assets collected inside this window block.</div>'; 
                    return; 
                }
                
                container.innerHTML = data.news.map(n => `
                    <div class="phoenix-card">
                        <b style="font-size:14px; display:block; margin-bottom:4px; line-height:1.4;">${n.title}</b>
                        <span style="font-size:10px; color:var(--text-muted); font-weight:bold; text-transform:uppercase;">${n.source}</span>
                    </div>`).join('');
            } catch(e) {
                container.innerHTML = '<div class="state-error">Failed to fetch micro sentiment updates.</div>';
            }
        }

        async function fetchPnl() {
            const label = document.getElementById('pnl-val');
            label.innerText = "Processing...";
            try {
                const response = await fetch(`${CORE_API}/api/v2/performance`);
                const data = await response.json();
                const pnlText = data.pnl || "0.00%";
                label.innerText = pnlText;
                label.style.color = pnlText.startsWith('-') ? "var(--danger)" : "var(--primary)";
            } catch(e) {
                label.innerText = "Error Syncing";
                label.style.color = "var(--danger)";
            }
        }

        async function executeAiQuery() {
            const inputField = document.getElementById('chat-input-field');
            const logBox = document.getElementById('chat-session-box');
            const queryText = inputField.value.trim();
            if(!queryText) return;

            logBox.innerHTML += `<div style="color:var(--text-muted); margin-top:10px; font-weight:bold;">User > ${queryText}</div>`;
            inputField.value = "";
            logBox.scrollTop = logBox.scrollHeight;
            
            try {
                const response = await fetch(`${CORE_API}/api/v2/chat`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ prompt: queryText })
                });
                const data = await response.json();
                logBox.innerHTML += `<div style="color:var(--primary); margin-top:8px; line-height:1.5; font-weight:500;">Core > ${data.reply}</div>`;
            } catch(e) {
                logBox.innerHTML += `<div style="color:var(--danger); margin-top:8px; font-weight:bold;">Core Execution Error. Connection timed out.</div>`;
            }
            logBox.scrollTop = logBox.scrollHeight;
        }

        window.addEventListener('DOMContentLoaded', () => { fetchPolymarket(); });
    </script>
</body>
</html>
