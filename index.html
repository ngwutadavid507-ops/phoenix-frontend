<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phoenix Base Terminal</title>
    <style>
        :root {
            --bg-dark: #0b0e14; --bg-surface: #161b22; --border: #30363d;
            --primary: #10b981; --text-main: #ffffff; --text-muted: #8b949e; --danger: #f85149;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { margin: 0; background-color: var(--bg-dark); color: var(--text-main); overflow: hidden; }
        .app-shell { display: flex; flex-direction: column; width: 100vw; height: 100vh; }
        .app-header { background: var(--bg-surface); padding: 14px 16px 0 16px; border-bottom: 1px solid var(--border); }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .brand { font-size: 18px; font-weight: 800; color: var(--primary); text-transform: uppercase; }
        .tabs-row { display: flex; margin-top: 12px; }
        .tab-item {
            flex: 1; text-align: center; padding: 12px 0; font-size: 12px; font-weight: 700;
            color: var(--text-muted); border: none; background: none; cursor: pointer; position: relative;
        }
        .tab-item.active { color: var(--primary); }
        .tab-item.active::after { content: ''; position: absolute; bottom: 0; left:0; right:0; height: 3px; background: var(--primary); }
        
        .nested-tab-bar { display: flex; background: rgba(0,0,0,0.3); border-radius: 8px; padding: 4px; margin-bottom: 12px; gap: 4px; }
        .sub-tab-item { flex: 1; text-align: center; padding: 8px 0; font-size: 11px; font-weight: 700; color: var(--text-muted); border: none; background: none; cursor: pointer; border-radius: 6px; }
        .sub-tab-item.active { background: var(--primary); color: #fff; }

        .view-viewport { flex: 1; overflow: hidden; position: relative; }
        .view-pane { display: none; width: 100%; height: 100%; overflow-y: auto; padding: 16px; flex-direction: column; }
        .view-pane.active { display: flex; }
        .sub-pane { display: none; }
        .sub-pane.active { display: block; }
        
        .phoenix-card { background: var(--bg-surface); border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid var(--border); }
        .flex-row { display: flex; justify-content: space-between; align-items: center; }
        .signal-badge { background: rgba(16,185,129,0.15); color: var(--primary); padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .signal-badge.short { background: rgba(248,81,73,0.15); color: var(--danger); }
        
        /* Chat Box Interface components */
        .chat-output { flex: 1; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow-y: auto; font-size: 13px; min-height: 200px; max-height: 320px; margin-bottom: 12px; }
        .chat-entry-box { display: flex; gap: 8px; }
        .chat-input { flex: 1; background: var(--bg-dark); border: 1px solid var(--border); color: #fff; border-radius: 6px; padding: 10px; font-size: 13px; }
        .chat-btn { background: var(--primary); color: #fff; border: none; border-radius: 6px; padding: 0 16px; font-weight: bold; cursor: pointer; }
        
        .pair-strip { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
        .pair-strip:hover { background: rgba(255,255,255,0.02); }
    </style>
</head>
<body>

    <div class="app-shell">
        <header class="app-header">
            <div class="header-top">
                <div class="brand">Phoenix Base</div>
                <div id="top-status-indicator" style="font-size:12px; color:var(--primary); font-weight:bold;">● ENGINE LIVE</div>
            </div>
            <div class="tabs-row">
                <button class="tab-item active" onclick="switchTab('polymarket')">Polymarket</button>
                <button class="tab-item" onclick="switchTab('news-ai')">News/AI</button>
                <button class="tab-item" onclick="switchTab('signals')">Signals</button>
                <button class="tab-item" onclick="switchTab('pnl')">P&L</button>
                <button class="tab-item" onclick="switchTab('pairs')">Pairs</button>
            </div>
        </header>

        <main class="view-viewport">
            <!-- POLYMARKET V2 -->
            <div id="pane-polymarket" class="view-pane active"><div id="poly-root"></div></div>

            <!-- NEWS / LIVE TERMINAL BRAIN -->
            <div id="pane-news-ai" class="view-pane">
                <div class="nested-tab-bar">
                    <button class="sub-tab-item active" id="btn-sub-news" onclick="switchSubTab('news')">News</button>
                    <button class="sub-tab-item" id="btn-sub-ai" onclick="switchSubTab('ai')">AI Terminal Core</button>
                </div>
                <div id="sub-pane-news" class="sub-pane active"><div id="news-root"></div></div>
                <div id="sub-pane-ai" class="sub-pane">
                    <div class="chat-output" id="chat-session-box">Phoenix Neural Interface operational. Submit queries below...</div>
                    <div class="chat-entry-box">
                        <input type="text" id="chat-input-field" class="chat-input" placeholder="Query market conditions...">
                        <button class="chat-btn" onclick="executeAiQuery()">Send</button>
                    </div>
                </div>
            </div>

            <!-- MATHEMATICAL DYNAMIC SIGNALS -->
            <div id="pane-signals" class="view-pane"><div id="signals-root"></div></div>

            <!-- PERFORMANCE TRACKER -->
            <div id="pane-pnl" class="view-pane">
                <div class="phoenix-card" style="text-align: center;">
                    <div style="font-size:12px; color:var(--text-muted); font-weight:bold; text-transform:uppercase;">Performance Trend</div>
                    <div id="pnl-val" style="color: var(--primary); margin: 10px 0; font-size:42px; font-weight:900;">+18.94%</div>
                </div>
            </div>

            <!-- LIVE MARKET ALL COINS VIEW -->
            <div id="pane-pairs" class="view-pane" style="padding:0;">
                <div id="pairs-root"></div>
            </div>
        </main>
    </div>

    <script>
        const CORE_API = "https://phoenix-signal-backend.onrender.com";

        function switchTab(id) {
            document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.view-pane').forEach(el => el.classList.remove('active'));
            const btn = Array.from(document.querySelectorAll('.tab-item')).find(b => b.innerText.toLowerCase().replace('/','-') === id.toLowerCase());
            if(btn) btn.classList.add('active');
            const pane = document.getElementById(`pane-${id}`);
            if(pane) pane.classList.add('active');

            if(id === 'polymarket') fetchPolymarket();
            if(id === 'news-ai') switchSubTab('news');
            if(id === 'signals') fetchSignals();
            if(id === 'pnl') fetchPnl();
            if(id === 'pairs') fetchPairs();
        }

        function switchSubTab(subId) {
            document.querySelectorAll('.sub-tab-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.sub-pane').forEach(el => el.classList.remove('active'));
            document.getElementById(`btn-sub-${subId}`).classList.add('active');
            document.getElementById(`sub-pane-${subId}`).classList.add('active');
            if(subId === 'news') fetchNews();
        }

        async function fetchPairs() {
            const el = document.getElementById('pairs-root');
            try {
                const r = await fetch(`${CORE_API}/api/v2/pairs`);
                const coins = await r.json();
                el.innerHTML = coins.map(c => `
                    <div class="pair-strip" onclick="window.open('https://www.tradingview.com/symbols/${c.symbol}USDT')">
                        <div>
                            <span style="font-weight:bold; font-size:15px;">${c.symbol} / USDT</span>
                            <div style="font-size:11px; color:var(--text-muted);">${c.name}</div>
                        </div>
                        <div style="text-align:right;">
                            <span style="font-family:monospace; font-weight:bold; font-size:15px;">$${c.price}</span>
                            <div style="font-size:12px; font-weight:bold; color:${c.change.startsWith('-') ? 'var(--danger)' : 'var(--primary)'}">${c.change}</div>
                        </div>
                    </div>`).join('');
            } catch(e) { el.innerHTML = '<div style="padding:20px;color:var(--danger)">Failed loading matrix ticker array nodes.</div>'; }
        }

        async function fetchPolymarket() {
            const el = document.getElementById('poly-root');
            try {
                const r = await fetch(`${CORE_API}/api/v2/polymarket`);
                const d = await r.json();
                el.innerHTML = d.markets.map(m => `
                    <div class="phoenix-card">
                        <div class="flex-row">
                            <span style="font-weight:bold; font-size:13.5px; max-width:82%; line-height:1.4;">${m.title}</span>
                            <span class="signal-badge">${m.odds}</span>
                        </div>
                    </div>`).join('');
            } catch(e) {}
        }

        async function fetchNews() {
            const el = document.getElementById('news-root');
            try {
                const r = await fetch(`${CORE_API}/api/v2/news`);
                const d = await r.json();
                el.innerHTML = d.news.map(n => `
                    <div class="phoenix-card">
                        <b style="font-size:14px; display:block; margin-bottom:4px; line-height:1.4;">${n.title}</b>
                        <span style="font-size:10px; color:var(--text-muted); font-weight:bold; text-transform:uppercase;">${n.source}</span>
                    </div>`).join('');
            } catch(e) {}
        }

        async function fetchSignals() {
            const el = document.getElementById('signals-root');
            try {
                const r = await fetch(`${CORE_API}/api/v2/history`);
                const d = await r.json();
                el.innerHTML = d.signals.map(s => `
                    <div class="phoenix-card">
                        <div class="flex-row" style="margin-bottom:14px;">
                            <span style="font-size:20px; font-weight:900; letter-spacing:-0.5px;">${s.pair}</span>
                            <span class="signal-badge ${s.direction.includes('SHORT') ? 'short' : ''}">${s.direction}</span>
                        </div>
                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px; font-size:13px; font-family:monospace;">
                            <div>ENTRY: <b style="color:#fff">$${s.entry}</b></div>
                            <div>CONFIDENCE: <b style="color:var(--primary)">${s.confidence}</b></div>
                            <div>STOP LOSS: <b style="color:var(--danger)">$${s.sl}</b></div>
                            <div>TAKE PROFIT: <b style="color:var(--primary)">$${s.tp}</b></div>
                        </div>
                    </div>`).join('');
            } catch(e) {}
        }

        async function fetchPnl() {
            try {
                const r = await fetch(`${CORE_API}/api/v2/performance`);
                const d = await r.json();
                document.getElementById('pnl-val').innerText = d.pnl;
            } catch(e) {}
        }

        async function executeAiQuery() {
            const inputEl = document.getElementById('chat-input-field');
            const box = document.getElementById('chat-session-box');
            const text = inputEl.value.trim();
            if(!text) return;

            box.innerHTML += `<div style="color:var(--text-muted); margin-top:8px;">You: ${text}</div>`;
            inputEl.value = "";
            
            try {
                const r = await fetch(`${CORE_API}/api/v2/chat`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ prompt: text })
                });
                const d = await r.json();
                box.innerHTML += `<div style="color:var(--primary); margin-top:6px; line-height:1.4;">Phoenix AI: ${d.reply}</div>`;
                box.scrollTop = box.scrollHeight;
            } catch(e) {
                box.innerHTML += `<div style="color:var(--danger); margin-top:6px;">Terminal pipeline error execution block.</div>`;
            }
        }

        window.addEventListener('DOMContentLoaded', () => { fetchPolymarket(); });
    </script>
</body>
    </html>
