<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phoenix Bybit Stream Terminal</title>
    <style>
        :root {
            --bg-dark: #0b0e14;
            --bg-surface: #161b22;
            --bg-card: #1c2230;
            --border: #30363d;
            --primary: #f7a600;
            --primary-dim: rgba(247,166,0,0.12);
            --text-main: #ffffff;
            --text-muted: #8b949e;
            --green: #26a69a;
            --red: #ef5350;
            --green-dim: rgba(38,166,154,0.12);
            --red-dim: rgba(239,83,80,0.12);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); overflow: hidden; height: 100vh; }
        .app { display: flex; flex-direction: column; height: 100vh; }

        /* HEADER */
        .header { background: var(--bg-surface); border-bottom: 1px solid var(--border); padding: 12px 16px 0; flex-shrink: 0; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .brand { font-size: 16px; font-weight: 900; color: var(--primary); letter-spacing: 1px; text-transform: uppercase; }
        .live-badge { font-size: 10px; color: var(--green); font-weight: 700; display: flex; align-items: center; gap: 4px; }
        .live-dot { width: 6px; height: 6px; background: var(--green); border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(1.3)} }

        /* TABS */
        .tabs { display: flex; overflow-x: auto; scrollbar-width: none; gap: 2px; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab { flex-shrink: 0; padding: 10px 14px; font-size: 11px; font-weight: 700; color: var(--text-muted); background: none; border: none; cursor: pointer; position: relative; text-transform: uppercase; letter-spacing: 0.5px; }
        .tab.active { color: var(--primary); }
        .tab.active::after { content:''; position:absolute; bottom:0; left:0; right:0; height:2px; background:var(--primary); border-radius:2px 2px 0 0; }

        /* CONTENT */
        .content { flex: 1; overflow: hidden; position: relative; }
        .pane { display: none; height: 100%; overflow-y: auto; padding: 12px; flex-direction: column; gap: 10px; }
        .pane.active { display: flex; }
        .pane-no-pad { display: none; height: 100%; overflow-y: auto; }
        .pane-no-pad.active { display: block; }

        /* SIGNAL CARD */
        .signal-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
        .signal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .signal-pair { font-size: 17px; font-weight: 900; letter-spacing: 0.5px; }
        .dir-badge { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; letter-spacing: 1px; }
        .dir-long { background: var(--green-dim); color: var(--green); }
        .dir-short { background: var(--red-dim); color: var(--red); }

        .signal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .sig-cell { background: rgba(255,255,255,0.03); border-radius: 8px; padding: 8px 10px; }
        .sig-label { font-size: 9px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 3px; }
        .sig-value { font-size: 13px; font-weight: 700; font-family: monospace; }
        .val-entry { color: var(--text-main); }
        .val-sl { color: var(--red); }
        .val-tp1 { color: #66bb6a; }
        .val-tp2 { color: var(--green); }
        .val-tp3 { color: var(--primary); }
        .val-conf { color: var(--primary); font-size: 15px; }
        .val-rr { color: #ce93d8; }

        .signal-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 8px; border-top: 1px solid var(--border); }
        .leverage-tag { background: var(--primary-dim); color: var(--primary); font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 4px; }
        .reasons { font-size: 10px; color: var(--text-muted); line-height: 1.5; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }

        /* PAIR ROW */
        .pair-row { display: flex; justify-content: space-between; align-items: center; padding: 13px 16px; border-bottom: 1px solid var(--border); }
        .pair-left .pair-sym { font-weight: 800; font-size: 14px; }
        .pair-left .pair-name { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
        .pair-right { text-align: right; }
        .pair-price { font-family: monospace; font-weight: 700; font-size: 14px; }
        .pair-change { font-size: 12px; font-weight: 700; margin-top: 2px; }
        .pos { color: var(--green); }
        .neg { color: var(--red); }

        /* SEARCH */
        .search-bar { display: flex; gap: 8px; margin-bottom: 12px; flex-shrink: 0; }
        .search-input { flex: 1; background: var(--bg-surface); border: 1px solid var(--border); color: #fff; border-radius: 8px; padding: 10px 12px; font-size: 13px; outline: none; }
        .search-input:focus { border-color: var(--primary); }
        .search-btn { background: var(--primary); color: #000; border: none; border-radius: 8px; padding: 0 16px; font-weight: 800; font-size: 13px; cursor: pointer; }
        .search-result { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; }
        .sr-left { display: flex; align-items: center; gap: 10px; }
        .sr-thumb { width: 28px; height: 28px; border-radius: 50%; }
        .sr-name { font-weight: 700; font-size: 13px; }
        .sr-sym { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
        .sr-rank { font-size: 10px; color: var(--text-muted); }
        .sr-right { text-align: right; }

        /* TRENDING */
        .trending-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
        .trend-rank { font-size: 11px; color: var(--text-muted); font-weight: 700; width: 20px; }
        .trend-thumb { width: 24px; height: 24px; border-radius: 50%; }
        .trend-info .trend-name { font-size: 13px; font-weight: 700; }
        .trend-info .trend-sym { font-size: 11px; color: var(--text-muted); }
        .trend-mcr { font-size: 11px; color: var(--text-muted); margin-left: auto; }

        .chat-wrap { display: flex; flex-direction: column; height: 100%; }
