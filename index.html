<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phoenix Aggregator Platform</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-dark: #0b0e14; --bg-surface: #161b22; --bg-card: #21262d;
            --primary: #10b981; --text-main: #ffffff; --text-muted: #8b949e;
            --danger: #f85149; --warning: #f0883e; --border: #30363d;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; background-color: var(--bg-dark); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden;
        }
        .app-shell { display: flex; flex-direction: column; width: 100vw; height: 100vh; }
        .app-header { background: var(--bg-surface); padding: 14px 16px 4px 16px; border-bottom: 1px solid var(--border); }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .brand { font-size: 16px; font-weight: 800; color: var(--primary); text-transform: uppercase; }
        .user-tag { font-size: 11px; color: var(--text-muted); }
        
        .tabs-row { display: flex; margin-top: 10px; gap: 4px; }
        .tab-item {
            flex: 1; text-align: center; padding: 10px 0; font-size: 11px; font-weight: 700;
            color: var(--text-muted); border: none; background: none; cursor: pointer; position: relative;
        }
        .tab-item.active { color: var(--primary); }
        .tab-item.active::after { content: ''; position: absolute; bottom: 0; left:0; right:0; height: 3px; background: var(--primary); }

        .nested-tab-bar { display: flex; background: rgba(0,0,0,0.3); border-radius: 8px; padding: 4px; margin-bottom: 12px; gap: 4px; }
        .sub-tab-item { flex: 1; text-align: center; padding: 8px 0; font-size: 11px; font-weight: 700; color: var(--text-muted); border: none; background: none; cursor: pointer; border-radius: 6px; }
        .sub-tab-item.active { background: var(--primary); color: #fff; }

        .view-viewport { flex: 1; overflow: hidden; position: relative; }
        .view-pane { display: none; width: 100%; height: 100%; overflow-y: auto; padding: 16px; }
        .view-pane.active { display: flex; flex-direction: column; }
        .sub-pane { display: none; }
        .sub-pane.active { display: block; }

        .phoenix-card { background: var(--bg-surface); border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid var(--border); }
        .source-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
        .badge-live { background: rgba(16,185,129,0.15); color: var(--primary); padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .badge-err { background: rgba(248,81,73,0.15); color: var(--danger); padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="app-shell">
        <header class="app-header">
            <div class="header-top">
                <div class="brand">Phoenix Multi-Engine</div>
                <div class="user-tag" id="user-display">@CHIDIBLESS10</div>
            </div>
            <div class="tabs-row">
                <button class="tab-item active" onclick="switchTab('polymarket')">Polymarket</button>
                <button class="tab-item" onclick="switchTab('news-ai')">News/AI</button>
                <button class="tab-item" onclick="switchTab('signals')">Signals</button>
                <button class="tab-item" onclick="switchTab('pnl')">P&L</button>
                <button class="tab-item" onclick="switchTab('pairs')">Pairs</button>
            </div>
        </header>

        <main class="view-viewport">
            <!-- POLYMARKET MULTI-ORACLE SECTOR -->
            <div id="pane-polymarket" class="view-pane active">
                <div id="poly-root"></div>
            </div>

            <!-- NEWS / AI SUB-NAV LAYOUT -->
            <div id="pane-news-ai" class="view-pane">
                <div class="nested-tab-bar">
                    <button class="sub-tab-item active" id="btn-sub-news" onclick="switchSubTab('news')">Aggregated News</button>
                    <button class="sub-tab-item" id="btn-sub-ai" onclick="switchSubTab('ai')">AI Terminal</button>
                </div>
                <div id="sub-pane-news" class="sub-pane active"><div id="news-root"></div></div>
                <div id="sub-pane-ai" class="sub-pane">
                    <div class="phoenix-card" style="color:var(--primary)">🤖 Multi-Source Processing Terminal Active. Ready for analytics inputs.</div>
                </div>
            </div>

            <!-- SIGNALS PIPELINE -->
            <div id="pane-signals" class="view-pane">
                <div id="signals-root"></div>
            </div>

            <!-- PERFORMANCE MODULE -->
            <div id="pane-pnl" class="view-pane">
                <div class="phoenix-card" style="text-align: center;">
                    <div style="font-size: 12px; color: var(--text-muted);">CROSS-CHANNEL PERFORMANCE INDEX</div>
                    <div id="pnl-val" style="font-size: 36px; font-weight: 900; color: var(--primary); margin: 10px 0;">+18.94%</div>
                    <div id="pnl-status" style="font-size: 12px; color: var(--text-muted);">Checking pipeline statuses...</div>
                </div>
            </div>

            <!-- PAIRS MODULE: LIVE 5 CRYPTO ENGINE MATRIX DISPLAY -->
            <div id="pane-pairs" class="view-pane">
                <div class="phoenix-card">
                    <div style="font-size: 12px; font-weight: bold; color: var(--text-muted); margin-bottom: 12px; text-transform: uppercase;">Real-Time Engine Stream (5 Channels)</div>
                    <div id="pairs-root"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Adjust this string link to exactly match your Render platform setup URL
        const CORE_API = "https://phoenix-backend-pdrh.onrender.com";

        function switchTab(id) {
            document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.view-pane').forEach(el => el.classList.remove('active'));
            
            const btn = Array.from(document.querySelectorAll('.tab-item')).find(b => b.innerText.toLowerCase().replace('/','-') === id.toLowerCase());
            if(btn) btn.classList.add('active');
            
            const targetPane = document.getElementById(`pane-${id}`);
            if(targetPane) targetPane.classList.add('active');

            if(id === 'polymarket') fetchPolymarket();
            if(id === 'news-ai') switchSubTab('news');
            if(id === 'signals') fetchSignals();
            if(id === 'pnl') fetchPnl();
            if(id === 'pairs') fetchPairs();
        }

        function switchSubTab(subId) {
            document.querySelectorAll('.sub-tab-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.sub-pane').forEach(el => el.classList.remove('active'));
            document.getElementById(`btn-sub-${subId}`).classList.add('active');
            document.getElementById(`sub-pane-${subId}`).classList.add('active');
            if(subId === 'news') fetchNews();
        }

        async function fetchPairs() {
            const container = document.getElementById('pairs-root');
            container.innerHTML = "Refreshed stream trackers...";
            try {
                const r = await fetch(`${CORE_API}/api/v2/pairs`);
                const d = await r.json();
                container.innerHTML = d.aggregated_sources.map(s => `
                    <div class="source-row">
                        <div>
                            <span style="font-weight:bold; color:#fff;">${s.source}</span>
                            <div style="font-size:11px; color:var(--text-muted)">BTC Valuation</div>
                        </div>
                        <div style="text-align:right;">
                            <span style="font-family:monospace; font-weight:bold;">${s.price ? '$'+s.price : '---'}</span>
                            <div>${s.change ? `<span style="color:var(--primary)">${s.change}</span>` : '<span class="badge-err">OFFLINE</span>'}</div>
                        </div>
                    </div>
                `).join('');
            } catch(e) {
                container.innerHTML = "<div class='badge-err'>Platform connection refused. Confirm your Render application cluster status is Active.</div>";
            }
        }

        async function fetchPolymarket() {
            const target = document.getElementById('poly-root');
            try {
                const r = await fetch(`${CORE_API}/api/v2/polymarket`);
                const d = await r.json();
                target.innerHTML = `
                    <div class="phoenix-card">
                        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                            <span style="font-weight:bold; font-size:14px;">${d.market_data.title}</span>
                            <span class="badge-live">LIVE Aggregation</span>
                        </div>
                        <div style="font-size:12px; color:var(--text-muted); margin-bottom:6px;">Sources: ${d.primary_source} + ${d.secondary_source}</div>
                        <p style="font-size:13px; margin:4px 0; color:#e2e8f0;">${d.market_data.summary}</p>
                    </div>`;
            } catch(e) { target.innerHTML = "<div class='badge-err'>Polymarket Pipeline Connection Error</div>"; }
        }

        async function fetchNews() {
            const target = document.getElementById('news-root');
            try {
                const r = await fetch(`${CORE_API}/api/v2/news`);
                const d = await r.json();
                target.innerHTML = d.feed.map(f => `
                    <div class="phoenix-card">
                        <div style="display:flex; justify-content:between; align-items:center; margin-bottom:6px;">
                            <b style="font-size:13px;">${f.title}</b>
                            <span class="badge-live">${f.badge}</span>
                        </div>
                        <div style="font-size:12px; color:var(--text-muted); line-height:1.4;">${f.description}</div>
                    </div>
                `).join('');
            } catch(e) { target.innerHTML = "<div class='badge-err'>News Aggregate Transmission Error</div>"; }
        }

        async function fetchSignals() {
            const target = document.getElementById('signals-root');
            try {
                const r = await fetch(`${CORE_API}/api/v2/history`);
                const d = await r.json();
                target.innerHTML = d.data.map(s => `
                    <div class="phoenix-card">
                        <div style="display:flex; justify-content:between; font-weight:bold; margin-bottom:8px;">
                            <span>${s.asset_pair}</span>
                            <span style="color:var(--primary)">${s.direction}</span>
                        </div>
                        <div style="font-size:12px; color:var(--text-muted)">Reason: "${s.analysis_reason}"</div>
                    </div>
                `).join('');
            } catch(e) { target.innerHTML = "<div class='badge-err'>Signal Pipeline Offline</div>"; }
        }

        async function fetchPnl() {
            try {
                const r = await fetch(`${CORE_API}/api/v2/performance`);
                const d = await r.json();
                document.getElementById('pnl-val').innerText = d.matrix_value;
                document.getElementById('pnl-status').innerText = d.status_message;
            } catch(e) { document.getElementById('pnl-status').innerText = "Aggregation verification systems disconnected."; }
        }

        window.addEventListener('DOMContentLoaded', () => { fetchPolymarket(); });
    </script>
</body>
</html>
