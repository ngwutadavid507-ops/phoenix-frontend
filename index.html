<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phoenix Bybit Stream Terminal</title>
    <style>
        :root {
            --bg-dark: #0b0e14;
            --bg-surface: #161b22;
            --border: #30363d;
            --primary: #f7a600;
            --text-main: #ffffff;
            --text-muted: #8b949e;
            --danger: #f85149;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { margin: 0; background-color: var(--bg-dark); color: var(--text-main); overflow: hidden; }
        .app-shell { display: flex; flex-direction: column; width: 100vw; height: 100vh; }

        .app-header { background: var(--bg-surface); padding: 14px 16px 0 16px; border-bottom: 1px solid var(--border); }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .brand { font-size: 18px; font-weight: 800; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; }
        .live-dot { font-size: 11px; color: var(--primary); font-weight: bold; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

        .tabs-row { display: flex; margin-top: 12px; overflow-x: auto; scrollbar-width: none; }
        .tabs-row::-webkit-scrollbar { display: none; }
        .tab-item {
            flex: 1; text-align: center; padding: 12px 8px; font-size: 12px; font-weight: 700;
            color: var(--text-muted); border: none; background: none; cursor: pointer;
            position: relative; white-space: nowrap;
        }
        .tab-item.active { color: var(--primary); }
        .tab-item.active::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: var(--primary); }

        .nested-tab-bar { display: flex; background: rgba(0,0,0,0.3); border-radius: 8px; padding: 4px; margin-bottom: 12px; gap: 4px; }
        .sub-tab-item { flex: 1; text-align: center; padding: 8px 0; font-size: 11px; font-weight: 700; color: var(--text-muted); border: none; background: none; cursor: pointer; border-radius: 6px; }
        .sub-tab-item.active { background: var(--primary); color: #000; }

        .view-viewport { flex: 1; overflow: hidden; position: relative; }
        .view-pane { display: none; width: 100%; height: 100%; overflow-y: auto; padding: 16px; flex-direction: column; }
        .view-pane.active { display: flex; }
        .sub-pane { display: none; }
        .sub-pane.active { display: block; }

        .phoenix-card { background: var(--bg-surface); border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid var(--border); }
        .flex-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .signal-badge { background: rgba(247,166,0,0.15); color: var(--primary); padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; text-transform: uppercase; white-space: nowrap; }
        .signal-badge.short { background: rgba(248,81,73,0.15); color: var(--danger); }

        .chat-output { flex: 1; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow-y: auto; font-size: 13px; min-height: 240px; max-height: 360px; margin-bottom: 12px; }
        .chat-entry-box { display: flex; gap: 8px; }
        .chat-input { flex: 1; background: var(--bg-dark); border: 1px solid var(--border); color: #fff; border-radius: 6px; padding: 10px; font-size: 13px; outline: none; }
        .chat-btn { background: var(--primary); color: #000; border: none; border-radius: 6px; padding: 0 16px; font-weight: bold; cursor: pointer; }

        .pair-strip { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--border); }

        /* Loading spinner */
        .loader { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 16px; gap: 16px; }
        .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-text { color: var(--text-muted); font-size: 12px; font-weight: bold; text-align: center; }

        .state-info { padding: 32px 16px; text-align: center; color: var(--text-muted); font-size: 13px; }
        .state-error { padding: 32px 16px; text-align: center; color: var(--danger); font-size: 13px; font-weight: bold; }
        .retry-btn { margin-top: 12px; background: var(--primary); color: #000; border: none; border-radius: 6px; padding: 10px 20px; font-weight: bold; cursor: pointer; font-size: 13px; }
    </style>
</head>
<body>
<div class="app-shell">
    <header class="app-header">
        <div class="header-top">
            <div class="brand">Phoenix Bybit Stream</div>
            <div class="live-dot">● LIVE TELEMETRY</div>
        </div>
        <div class="tabs-row">
            <button class="tab-item active" onclick="switchTab('signals')">Signals</button>
            <button class="tab-item" onclick="switchTab('pairs')">Live Pairs</button>
            <button class="tab-item" onclick="switchTab('news-ai')">News / AI</button>
            <button class="tab-item" onclick="switchTab('polymarket')">Prediction</button>
            <button class="tab-item" onclick="switchTab('pnl')">Performance</button>
        </div>
    </header>

    <main class="view-viewport">
        <div id="pane-signals" class="view-pane active"><div id="signals-root"></div></div>
        <div id="pane-pairs" class="view-pane" style="padding:0;"><div id="pairs-root"></div></div>

        <div id="pane-news-ai" class="view-pane">
            <div class="nested-tab-bar">
                <button class="sub-tab-item active" id="btn-sub-news" onclick="switchSubTab('news')">Live News Feed</button>
                <button class="sub-tab-item" id="btn-sub-ai" onclick="switchSubTab('ai')">Gemini Oracle</button>
            </div>
            <div id="sub-pane-news" class="sub-pane active"><div id="news-root"></div></div>
            <div id="sub-pane-ai" class="sub-pane">
                <div class="chat-output" id="chat-session-box">Phoenix Core AI online. Enter ticker or market questions below...</div>
                <div class="chat-entry-box">
                    <input type="text" id="chat-input-field" class="chat-input" placeholder="Query Gemini Processing core...">
                    <button class="chat-btn" onclick="executeAiQuery()">Query</button>
                </div>
            </div>
        </div>

        <div id="pane-polymarket" class="view-pane"><div id="poly-root"></div></div>
        <div id="pane-pnl" class="view-pane">
            <div class="phoenix-card" style="text-align:center; padding:32px 16px;">
                <div style="font-size:11px; color:var(--text-muted); font-weight:bold; text-transform:uppercase;">Calculated Signal Variance Index</div>
                <div style="color:var(--primary); margin:12px 0; font-size:44px; font-weight:900; font-family:monospace;">+4.12%</div>
            </div>
        </div>
    </main>
</div>

<script>
    const CORE_API = "https://phoenix-signal-backend.onrender.com";

    function loader(msg) {
        return `<div class="loader"><div class="spinner"></div><div class="loader-text">${msg}<br>Backend may be waking up (up to 30s)</div></div>`;
    }

    function switchTab(id) {
        document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.view-pane').forEach(el => el.classList.remove('active'));
        const btn = Array.from(document.querySelectorAll('.tab-item')).find(b => b.getAttribute('onclick').includes(`'${id}'`));
        if (btn) btn.classList.add('active');
        const pane = document.getElementById(`pane-${id}`);
        if (pane) pane.classList.add('active');
        if (id === 'signals') fetchSignals();
        if (id === 'pairs') fetchPairs();
        if (id === 'news-ai') switchSubTab('news');
        if (id === 'polymarket') fetchPolymarket();
    }

    function switchSubTab(subId) {
        document.querySelectorAll('.sub-tab-item').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.sub-pane').forEach(el => el.classList.remove('active'));
        document.getElementById(`btn-sub-${subId}`).classList.add('active');
        document.getElementById(`sub-pane-${subId}`).classList.add('active');
        if (subId === 'news') fetchNews();
    }

    async function fetchWithRetry(url, retries = 2) {
        for (let i = 0; i <= retries; i++) {
            try {
                const r = await fetch(url, { signal: AbortSignal.timeout(55000) });
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                return await r.json();
            } catch (e) {
                if (i === retries) throw e;
                await new Promise(res => setTimeout(res, 3000));
            }
        }
    }

    async function fetchSignals() {
        const container = document.getElementById('signals-root');
        container.innerHTML = loader('Fetching live signals...');
        try {
            const data = await fetchWithRetry(`${CORE_API}/api/v2/history`);
            if (!data.signals || data.signals.length === 0) {
                container.innerHTML = '<div class="state-info">No active trends detected.<br><small>Bybit returned no matching pairs.</small></div>';
                return;
            }
            container.innerHTML = data.signals.map(s => `
                <div class="phoenix-card">
                    <div class="flex-row" style="margin-bottom:12px;">
                        <span style="font-size:18px; font-weight:900;">${s.pair}</span>
                        <span class="signal-badge ${s.direction.includes('SHORT') ? 'short' : ''}">${s.direction}</span>
                    </div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; font-size:12px; font-family:monospace;">
                        <div>ENTRY: <b>$${s.entry}</b></div>
                        <div>CONFIDENCE: <b style="color:var(--primary)">${s.confidence}</b></div>
                        <div>STOP LOSS: <b style="color:var(--danger)">$${s.sl}</b></div>
                        <div>TAKE PROFIT: <b style="color:var(--primary)">$${s.tp}</b></div>
                        <div style="grid-column:span 2; color:var(--text-muted);">24H CHANGE: <b style="color:${s.raw_change >= 0 ? 'var(--primary)' : 'var(--danger)'}">${s.raw_change > 0 ? '+' : ''}${s.raw_change}%</b></div>
                    </div>
                </div>`).join('');
        } catch (e) {
            container.innerHTML = `<div class="state-error">Signals endpoint unreachable.<br><small>${e.message}</small><br><button class="retry-btn" onclick="fetchSignals()">Retry</button></div>`;
        }
    }

    async function fetchPairs() {
        const container = document.getElementById('pairs-root');
        container.innerHTML = `<div style="padding:16px;">${loader('Fetching live pairs...')}</div>`;
        try {
            const coins = await fetchWithRetry(`${CORE_API}/api/v2/pairs`);
            if (!coins || coins.length === 0) {
                container.innerHTML = '<div class="state-info" style="padding:20px;">No pairs data available.</div>';
                return;
            }
            container.innerHTML = coins.map(c => {
                const isNeg = c.change.startsWith('-');
                return `
                <div class="pair-strip">
                    <div>
                        <span style="font-weight:bold; font-size:15px;">${c.symbol}/USDT</span>
                        <div style="font-size:11px; color:var(--text-muted);">${c.name}</div>
                    </div>
                    <div style="text-align:right;">
                        <span style="font-family:monospace; font-weight:bold;">$${c.price}</span>
                        <div style="font-size:12px; font-weight:bold; color:${isNeg ? 'var(--danger)' : 'var(--primary)'}">${c.change}</div>
                    </div>
                </div>`;
            }).join('');
        } catch (e) {
            container.innerHTML = `<div class="state-error" style="padding:20px;">Pairs endpoint unreachable.<br><small>${e.message}</small><br><button class="retry-btn" onclick="fetchPairs()">Retry</button></div>`;
        }
    }

    async function fetchPolymarket() {
        const container = document.getElementById('poly-root');
        container.innerHTML = loader('Loading predictions...');
        try {
            const data = await fetchWithRetry(`${CORE_API}/api/v2/polymarket`);
            container.innerHTML = data.markets.map(m => `
                <div class="phoenix-card"><div class="flex-row">
                    <span style="font-weight:bold; font-size:13px; max-width:80%;">${m.title}</span>
                    <span class="signal-badge">${m.odds}</span>
                </div></div>`).join('');
        } catch (e) {
            container.innerHTML = `<div class="state-error">Prediction endpoint unreachable.<br><button class="retry-btn" onclick="fetchPolymarket()">Retry</button></div>`;
        }
    }

    async function fetchNews() {
        const container = document.getElementById('news-root');
        container.innerHTML = loader('Loading news feed...');
        try {
            const data = await fetchWithRetry(`${CORE_API}/api/v2/news`);
            container.innerHTML = data.news.map(n => `
                <div class="phoenix-card">
                    <b style="font-size:13px; display:block; margin-bottom:4px;">${n.title}</b>
                    <span style="font-size:10px; color:var(--text-muted); font-weight:bold; text-transform:uppercase;">${n.source}</span>
                </div>`).join('');
        } catch (e) {
            container.innerHTML = `<div class="state-error">News feed unreachable.<br><button class="retry-btn" onclick="fetchNews()">Retry</button></div>`;
        }
    }

    async function executeAiQuery() {
        const input = document.getElementById('chat-input-field');
        const box = document.getElementById('chat-session-box');
        const promptText = input.value.trim();
        if (!promptText) return;

        box.innerHTML += `<div style="color:var(--text-muted); margin-top:10px; font-weight:bold;">You > ${promptText}</div>`;
        box.innerHTML += `<div id="ai-thinking" style="color:var(--primary); margin-top:6px; opacity:0.6;">Oracle processing...</div>`;
        input.value = '';
        box.scrollTop = box.scrollHeight;

        try {
            const r = await fetch(`${CORE_API}/api/v2/chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: promptText }),
                signal: AbortSignal.timeout(55000)
            });
            const data = await r.json();
            document.getElementById('ai-thinking')?.remove();
            box.innerHTML += `<div style="color:var(--primary); margin-top:8px; line-height:1.5;">Oracle > ${data.reply}</div>`;
        } catch (e) {
            document.getElementById('ai-thinking')?.remove();
            box.innerHTML += `<div style="color:var(--danger); margin-top:8px; font-weight:bold;">Connection fault. Check backend logs.</div>`;
        }
        box.scrollTop = box.scrollHeight;
    }

    // Wake backend immediately on load
    fetch(`${CORE_API}/ping`).catch(() => {});
    window.addEventListener('DOMContentLoaded', () => { fetchSignals(); });
</script>
</body>
</html>
